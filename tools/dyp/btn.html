<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Secure Button</title>
    <style>
        .aspect-ratio-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            overflow: hidden;
        }
        #secureBtn {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            font-size: 10vw;
            background: #000000;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
        #secureBtn:hover { background: #393737; }
        #secureBtn:disabled { opacity: 0.6; cursor: default; }
    </style>
</head>
<body>

<div class="aspect-ratio-wrapper">
    <button id="secureBtn">▷</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
(function () {
    const playerURL = "https://gentle-duckanoo-fe6f04.netlify.app/"; // ← Your actual player page

    // Read video id from ?id=VIDEO or unnamed ?VIDEO or #VIDEO
    function getVideoId(loc) {
        const params = new URLSearchParams(loc.search);
        if (params.has('id') && params.get('id').trim() !== '') return params.get('id').trim();
        const raw = loc.search.replace(/^\?/, '');
        if (raw && !raw.includes('=')) return raw;
        const hash = loc.hash.replace(/^#/, '');
        if (hash) return hash;
        return null;
    }

    function isMaybeYouTubeId(id) {
        return typeof id === 'string' && /^[A-Za-z0-9_-]{6,20}$/.test(id);
    }

    const videoID = getVideoId(window.location);
    const btn = document.getElementById('secureBtn');

    if (!videoID) {
        btn.disabled = true;
        btn.textContent = 'No video ID';
        btn.setAttribute('aria-disabled', 'true');
        return;
    }
    if (!isMaybeYouTubeId(videoID)) {
        btn.disabled = true;
        btn.textContent = 'Invalid ID';
        btn.setAttribute('aria-disabled', 'true');
        return;
    }

    window.openSecureLink = function () {
        if (typeof CryptoJS === 'undefined' || !CryptoJS.MD5) {
            console.error('CryptoJS not available');
            alert('Required crypto library not loaded.');
            return;
        }

        try {
            const encodedID = btoa(videoID);
            const now = new Date();
            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yy = String(now.getFullYear()).slice(2);
            const dateStr = dd + mm + yy;
            const token = CryptoJS.MD5(dateStr).toString();

            const finalLink = `${playerURL}?id=${encodeURIComponent(encodedID)}&token=${encodeURIComponent(token)}`;
            window.open(finalLink, '_blank', 'noopener,noreferrer');
        } catch (err) {
            console.error(err);
            alert('Failed to open player.');
        }
    };

    // Maintain original inline onclick usage compatibility
    btn.setAttribute('onclick', 'openSecureLink()');
})();
</script>

</body>
</html>
