<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Secure Button</title>
  <style>
    .aspect-ratio-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
    }
    #secureBtn {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      font-size: 10vw;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }
    #secureBtn:hover { background: #393737; }
    #secureBtn:focus { outline: 3px solid #66aaff; }
  </style>
</head>
<body>

<div class="aspect-ratio-wrapper">
  <button id="secureBtn" aria-label="Open player">▷</button>
</div>

<script>
(function () {
  // CONFIG: set the player base URL where the player page is hosted
  const playerURL = "https://gentle-duckanoo-fe6f04.netlify.app/";

  // Helper: get the "video id" from either "?id=..." or plain "?VIDEOID"
  function getVideoIdFromLocation(loc) {
    const params = new URLSearchParams(loc.search);
    if (params.has('id') && params.get('id').trim() !== '') {
      return params.get('id').trim();
    }
    // If there is a single unnamed query like ?TKuIKdGGpCQ
    const raw = loc.search.replace(/^\?/, '');
    if (raw && !raw.includes('=')) return raw;
    // As fallback, check hash (e.g., #VIDEOID)
    const hash = loc.hash.replace(/^#/, '');
    if (hash) return hash;
    return null;
  }

  // Extract video ID
  const videoId = getVideoIdFromLocation(window.location);
  const btn = document.getElementById('secureBtn');

  // Disable button if no video id found
  if (!videoId) {
    btn.disabled = true;
    btn.textContent = 'No video ID';
    btn.setAttribute('aria-disabled', 'true');
    return;
  }

  // Validate basic format: YouTube IDs are 11 characters (common), but allow flexible checks
  function isMaybeYouTubeId(id) {
    return typeof id === 'string' && /^[A-Za-z0-9_-]{6,20}$/.test(id);
  }
  if (!isMaybeYouTubeId(videoId)) {
    btn.disabled = true;
    btn.textContent = 'Invalid ID';
    btn.setAttribute('aria-disabled', 'true');
    return;
  }

  // When clicked, open the player page with encoded params
  btn.addEventListener('click', function () {
    try {
      const encodedID = btoa(videoId); // safe for ASCII YouTube IDs
      const finalLink = `${playerURL}?id=${encodeURIComponent(encodedID)}`;
      // Open with noopener/noreferrer to avoid giving opener access and avoid referrer leakage
      window.open(finalLink, '_blank', 'noopener,noreferrer');
    } catch (err) {
      console.error(err);
      alert('Failed to open player.');
    }
  });
})();
</script>

</body>
</html>
